<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday My Love ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts-container"></div>

    <main class="birthday-container">

        <div class="heart-icon">❤️</div>

        <h1>
            Happy Birthday
            <span>My Love ❤️</span>
        </h1>

        <p class="message">
            Today is all about you ✨
        </p>

        <div class="question-box">
            <h2>Do you want to see a surprise? 🥺</h2>

            <div class="buttons">

                <button id="yesBtn" class="yes-btn">
                    YES ❤️
                </button>

                <button id="noBtn" class="no-btn">
                    NO 😏
                </button>

            </div>

            <p class="hint">
                Choose carefully 👀
            </p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
